# OMP session tmux configuration — bundled with ompc.
# Each OMP session gets its own tmux server (ompc uses -L <session-name>)
# for per-session process isolation and failure containment.

# OSC 52 clipboard + Kitty graphics + OSC 9/99 notification passthrough.
# OMP detects $TMUX and wraps its own DCS payloads internally; this setting
# lets the raw and wrapped sequences reach the outer terminal.
set -g allow-passthrough on

# Modified-key encoding for Shift+Enter, Ctrl+H, and similar combos.
# csi-u format requires tmux >= 3.5 (the hub host has 3.7c).
set -g extended-keys on
set -g extended-keys-format csi-u

# Terminal capabilities.
set -g default-terminal "tmux-256color"
set -g history-limit 10000

# Mouse scroll enters copy-mode and scrolls the pane scrollback buffer
# instead of sending up/down arrows to the application (which OMP's TUI
# interprets as input-history cycling).
set -g mouse on