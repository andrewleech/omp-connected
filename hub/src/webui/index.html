<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="same-origin">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/favicon-180x180.png">
<title>OMP fleet</title>
<style>
:root { color-scheme: dark; font-family: ui-sans-serif, system-ui, sans-serif; background: #101317; color: #e8edf2; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; }
button, select, textarea { font: inherit; }
button { border: 1px solid #3c4b59; border-radius: .45rem; background: #1d2a36; color: inherit; cursor: pointer; padding: .45rem .65rem; }
button:hover:not(:disabled), button.active { background: #2a5d79; }
button:disabled { cursor: not-allowed; opacity: .45; }
select, textarea { border: 1px solid #3c4b59; border-radius: .4rem; background: #111920; color: inherit; padding: .5rem; width: 100%; }
textarea { min-height: 7rem; resize: vertical; }
.omp-shell { display: grid; grid-template-columns: minmax(14rem, 19rem) minmax(0, 1fr) minmax(17rem, 24rem); grid-template-rows: auto 1fr; height: 100vh; overflow: hidden; }
.topbar { align-items: center; background: #17212b; border-bottom: 1px solid #344453; display: flex; gap: 1rem; grid-column: 1 / -1; justify-content: space-between; padding: .7rem 1rem; }
.brand { font-weight: 700; letter-spacing: .03em; }
.status { color: #b7c4cf; font-size: .9rem; margin-left: auto; }
.status.ok { color: #91d9b3; }.status.warning { color: #ffc776; }
.session-rail, .inspector { background: #131a21; overflow: auto; padding: .8rem; }
.session-rail { border-right: 1px solid #344453; }.inspector { border-left: 1px solid #344453; }
.quiet { background: transparent; border-style: dashed; margin-bottom: .8rem; width: 100%; }
.session-group { border-top: 1px solid #2b3945; margin-top: .65rem; padding-top: .65rem; min-height: 2.2rem; }
.session-group h2, .inspector h2 { font-size: .86rem; letter-spacing: .06em; margin: 0 0 .45rem; text-transform: uppercase; }
.session-card { -webkit-touch-callout: none; -webkit-user-select: none; align-items: center; background: transparent; border-color: transparent; display: flex; gap: .5rem; justify-content: space-between; margin: .1rem 0; padding: .4rem .55rem; text-align: left; touch-action: manipulation; user-select: none; width: 100%; }.session-card:hover:not(:disabled) { background: #1d2a36; }.session-card.selected { background: #1d2a36; border-color: #65b9e8; box-shadow: inset .2rem 0 #65b9e8; }.session-label { color: #e8edf2; flex: 1; font-size: .84rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }.badge { border: 1px solid currentColor; border-radius: .3rem; flex-shrink: 0; font-size: .68rem; letter-spacing: .03em; padding: .08rem .35rem; text-transform: uppercase; }.badge.control { color: #9be5bd; }.badge.view { color: #8bcdf7; }.badge.connecting { color: #b7c4cf; }
.ctx-menu { background: #1a232c; border: 1px solid #3c4b59; border-radius: .5rem; box-shadow: 0 .4rem 1.2rem rgba(0,0,0,.45); list-style: none; margin: 0; min-width: 10rem; padding: .3rem; position: fixed; z-index: 20; }.ctx-menu li { margin: 0; }.ctx-menu button { background: transparent; border: 0; border-radius: .35rem; display: block; font-size: .85rem; padding: .4rem .55rem; text-align: left; white-space: nowrap; width: 100%; }.ctx-menu button:hover:not(:disabled) { background: #2a5d79; }
.workspace { display: flex; flex-direction: column; min-width: 0; overflow: hidden; padding: .9rem; }.workspace-header { align-items: center; display: flex; flex-shrink: 0; }.workspace-title { align-items: center; display: flex; gap: .6rem; min-width: 0; }.workspace-title-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }.channel-hint, .inspector-body p { color: #acbac7; font-size: .9rem; line-height: 1.4; flex-shrink: 0; }.empty { color: #a7b6c4; font-size: .86rem; }.workspace-empty { align-self: center; justify-self: center; max-width: 34rem; text-align: center; }.collab-frame { border: 1px solid #344453; border-radius: .55rem; flex: 1; min-height: 0; width: 100%; }
.tabs { display: flex; flex-wrap: wrap; gap: .35rem; margin-bottom: .8rem; }.tabs button { background: transparent; border: 0; border-bottom: .15rem solid transparent; border-radius: 0; padding: .35rem .2rem; }.tabs button.active { border-bottom-color: #65b9e8; }
.agent-roster { display: flex; flex-direction: column; gap: .2rem; margin-bottom: .8rem; }.agent-row { align-items: center; background: transparent; border-color: transparent; display: flex; gap: .4rem; justify-content: space-between; padding: .4rem .55rem; text-align: left; width: 100%; }.agent-row:hover:not(:disabled) { background: #1d2a36; }.agent-row.selected { background: #1d2a36; border-color: #65b9e8; box-shadow: inset .2rem 0 #65b9e8; }.agent-label { color: #e8edf2; flex: 1; font-size: .84rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }.agent-compose h3 { font-size: .86rem; margin: .4rem 0; }
form { display: grid; gap: .55rem; }
@media (max-width: 900px) { .omp-shell { grid-template-columns: minmax(12rem, 15rem) minmax(0, 1fr); }.inspector { border-left: 0; border-top: 1px solid #344453; grid-column: 1 / -1; }.workspace { min-height: 66vh; } }
@media (max-width: 620px) { .omp-shell { display: flex; flex-direction: column; }.topbar { position: sticky; top: 0; z-index: 1; }.session-rail { border-bottom: 1px solid #344453; border-right: 0; max-height: 35vh; }.workspace { min-height: 64vh; }.workspace-header { align-items: start; flex-direction: column; }.collab-frame { min-height: 52vh; }.status { margin-left: 0; } }
.tail-viewer { display: flex; flex-direction: column; flex: 1; min-height: 0; border: 1px solid #344453; border-radius: .55rem; background: #0d1117; overflow: hidden; }
.tail-status { padding: .5rem .8rem; font-size: .82rem; color: #8b949e; border-bottom: 1px solid #21262d; flex-shrink: 0; }.tail-status.ok { color: #91d9b3; }.tail-status.warning { color: #ffc776; }
.tail-scroll { flex: 1; min-height: 0; overflow-y: auto; padding: .4rem 0; }
.tail-load-more { text-align: center; padding: .4rem; font-size: .78rem; color: #58a6ff; cursor: pointer; }.tail-load-more:hover { text-decoration: underline; }
.tail-content { display: flex; flex-direction: column; }
.tail-entry { display: flex; gap: .5rem; padding: .25rem .8rem; font-size: .82rem; line-height: 1.45; border-bottom: 1px solid #161b22; word-break: break-word; }
.tail-entry:hover { background: #161b22; }
.tail-role { flex-shrink: 0; width: 1.2rem; text-align: center; color: #8b949e; }
.tail-body { white-space: pre-wrap; color: #c9d1d9; min-width: 0; }
.entry-assistant .tail-role { color: #a5d6ff; }.entry-assistant .tail-body { color: #e6edf3; }
.entry-user .tail-role { color: #7ee787; }.entry-user .tail-body { color: #adbac7; }
.entry-tool .tail-role { color: #d2a8ff; }.entry-tool .tail-body { color: #8b949e; font-size: .78rem; }
.tail-entry.collapsed { cursor: pointer; }.tail-entry.collapsed .tail-full { display: none; }
.tail-entry:not(.collapsed) .tail-preview { display: none; }
.tail-header { color: #8b949e; font-style: italic; display: block; }
.tail-preview { color: #6e7681; font-size: .78rem; display: block; margin-top: .15rem; }
</style>
</head>
<body>
<main class="omp-shell" data-omp-dashboard>
<header class="topbar"><span class="brand">OMP fleet</span><span class="status" data-status>Loading fleet…</span><button type="button" data-refresh>Refresh</button></header>
<aside class="session-rail" aria-label="Sessions" data-session-rail></aside>
<section class="workspace" aria-label="Selected OMP session" data-workspace><iframe class="collab-frame" data-collab-frame title="OMP Collab session" referrerpolicy="no-referrer"></iframe></section>
<aside class="inspector" aria-label="Inspector" data-inspector></aside>
</main>
<script type="module" src="/app.js"></script>
</body>
</html>
