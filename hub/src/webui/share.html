<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>OMP session</title>
<style>
html, body { height: 100%; margin: 0; background: #1c2128; color: #c9d1d9; font: 15px system-ui, sans-serif; }
iframe { border: 0; display: block; height: 100%; width: 100%; }
[hidden] { display: none !important; }
.share-status { align-items: center; display: flex; flex-direction: column; gap: .8rem; height: 100%; justify-content: center; padding: 1rem; text-align: center; }
.share-status p { margin: 0; max-width: 32rem; }
.share-status button { background: #2d333b; border: 1px solid #444c56; border-radius: .4rem; color: inherit; cursor: pointer; font: inherit; padding: .45rem .9rem; }
</style>
</head>
<body>
<div class="share-status" data-status role="status"><p data-status-text>Connecting…</p><button type="button" data-retry hidden>Start session</button></div>
<iframe data-frame title="OMP Collab session" referrerpolicy="no-referrer" hidden></iframe>
<script type="module" src="/share.js"></script>
</body>
</html>
